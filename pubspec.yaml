name: rally_app
description: Rally social + telemetry tracker (offline-first, free-tier Firebase + Mapbox)
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0
  geolocator: ^13.0.1
  permission_handler: ^11.3.1
  mapbox_maps_flutter: 3.0.0
  connectivity_plus: ^6.0.0
  sqflite: ^2.3.0
  path: ^1.9.0
  provider: ^6.1.2
  package_info_plus: ^8.0.0
  dio: ^5.4.0
  open_filex: ^4.4.0
  path_provider: ^2.1.3
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true


flutter_launcher_icons:
  android: true
  image_path: assets_icon.png

